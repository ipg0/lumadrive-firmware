; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
; Match sdkconfig.esp32dev; the two OTA slots and hardware config fit 2 MiB flash.
board_upload.flash_size = 2MB
board_build.partitions = partitions.csv
extra_scripts = pre:provisioning/platformio_targets.py
; Optionally set custom_hardware_config to a node-specific provisioning header.
; custom_hardware_config = /path/to/my_node.hpp

lib_deps =
  nanopb/Nanopb@^0.4.91

; Opt-in on-device heap stress test; do not use this environment for releases.
[env:memory_test]
extends = env:esp32dev
board_build.esp-idf.sdkconfig_path = sdkconfig.esp32dev
build_flags = -DMATRIX_MEMORY_STRESS_TEST
